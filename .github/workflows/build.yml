name: Build PeDitXOS Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  OPENWRT_VERSION: "23.05.3"
  TARGET_DIR: "x86/64"
  TARGET_NAME: "x86-64"
  PROFILE: "generic"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Install Required Tools
        run: |
          sudo apt update
          sudo apt install -y wget tar make coreutils

      - name: 🔻 Download ImageBuilder
        run: |
          # محاسبه IMAGEBUILDER_FILENAME در زمان اجرا و ذخیره در یک متغیر شل
          IMAGEBUILDER_FILENAME="openwrt-imagebuilder-${{ env.OPENWRT_VERSION }}-${{ env.TARGET_NAME }}.Linux-x86_64.tar.xz"
          
          wget https://downloads.openwrt.org/releases/${{ env.OPENWRT_VERSION }}/targets/${{ env.TARGET_DIR }}/"$IMAGEBUILDER_FILENAME"
          tar -xf "$IMAGEBUILDER_FILENAME"

      - name: 🛠 Build Custom Firmware Image
        run: |
          mkdir -p output
          
          # محاسبه IMAGEBUILDER_FOLDER_NAME در زمان اجرا و استفاده از آن برای cd
          IMAGEBUILDER_FOLDER_NAME="openwrt-imagebuilder-${{ env.OPENWRT_VERSION }}-${{ env.TARGET_NAME }}.Linux-x86_64"
          cd "$IMAGEBUILDER_FOLDER_NAME"
          
          make image PROFILE=${{ env.PROFILE }} \
            PACKAGES="ttyd bash coreutils whiptail wget gzip uci luci luci-ssl ip-full jq jsonfilter lsblk \
            kmod-e1000 kmod-e1000e kmod-igb kmod-ixgbe \
            kmod-r8169 kmod-tulip kmod-forcedeth kmod-vmxnet3" \
            FILES=../files \
            BIN_DIR=${{ github.workspace }}/output || exit 1

      - name: 🔍 Debug Output Files
        run: |
          echo "==== OUTPUT FILES ===-"
          find output/ -type f
          echo "======================"

      - name: 📤 Upload All Outputs
        uses: actions/upload-artifact@v4
        with:
          name: PeDitXOS-Firmware
          path: output/**
