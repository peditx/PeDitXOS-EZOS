name: Build PeDitXOS Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  OPENWRT_VERSION: "23.05.3"
  TARGET_DIR: "x86/64"
  TARGET_NAME: "x86-64"
  PROFILE: "generic"
  IMAGEBUILDER_DIR: "openwrt-imagebuilder-${{ env.OPENWRT_VERSION }}-${{ env.TARGET_NAME }}.Linux-x86_64" # اضافه شده

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v3

      - name: 📦 Install Required Tools
        run: |
          sudo apt update
          sudo apt install -y wget tar make coreutils

      - name: 🔻 Download ImageBuilder
        run: |
          wget https://downloads.openwrt.org/releases/${{ env.OPENWRT_VERSION }}/targets/${{ env.TARGET_DIR }}/openwrt-imagebuilder-${{ env.OPENWRT_VERSION }}-${{ env.TARGET_NAME }}.Linux-x86_64.tar.xz
          tar -xf openwrt-imagebuilder-${{ env.OPENWRT_VERSION }}-${{ env.TARGET_NAME }}.Linux-x86_64.tar.xz

      - name: 🛠 Build Custom Firmware Image
        run: |
          # ایجاد پوشه output در ریشه workspace
          mkdir -p output
          
          # تغییر مسیر به دایرکتوری ImageBuilder
          cd ${{ env.IMAGEBUILDER_DIR }}
          
          # ساخت ایمیج با تعیین مسیر خروجی به صورت مطلق
          make image PROFILE=${{ env.PROFILE }} \
            PACKAGES="ttyd bash coreutils whiptail wget gzip uci luci luci-ssl ip-full jq jsonfilter \
            kmod-e1000 kmod-e1000e kmod-igb kmod-ixgbe \
            kmod-r8169 kmod-tulip kmod-forcedeth kmod-vmxnet3" \
            FILES=../files \
            BIN_DIR=${{ github.workspace }}/output || exit 1 # اصلاح شده: استفاده از github.workspace

      - name: 🔍 Debug Output Files
        run: |
          echo "==== OUTPUT FILES ===="
          find output/ -type f
          echo "======================"

      - name: 📤 Upload All Outputs
        uses: actions/upload-artifact@v4
        with:
          name: PeDitXOS-Firmware
          path: output/**
